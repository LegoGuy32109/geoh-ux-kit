<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoH UX Kit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <script>
      /*
       * Unfolds the path that .github/pages-404.html folded into the query
       * string, before React Router reads the location. No-op everywhere else,
       * including local dev — nothing writes a `?/` query but that redirect.
       */
      ;(function () {
        var search = window.location.search
        if (search[1] !== '/') return
        var decoded = search
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&')
          })
          .join('?')
        window.history.replaceState(null, null, window.location.pathname.slice(0, -1) + decoded + window.location.hash)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
