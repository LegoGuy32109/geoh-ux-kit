# Yarn 4. The version is pinned by the `packageManager` field in package.json
# and resolved by Corepack, so every machine and CI run gets the same yarn
# without a binary checked into the repo.

# node_modules rather than PnP: Vite and the React tooling are happiest with a
# real tree, and editor tooling works with no extra setup. Same choice geoh made.
nodeLinker: node-modules

npmRegistryServer: "https://registry.npmjs.org"

# Keep the cache in-repo so it cannot drift with a machine-global one.
enableGlobalCache: false
enableMirror: false
cacheFolder: .yarn/cache

checksumBehavior: "throw"

# Allows git hooks to run.
enableScripts: true

# NOTE: geoh's .yarnrc.yml also carries npmScopes for its private @geoh and
# @formio registries, with credentials inline. This repo has no private
# dependencies, so those blocks are deliberately not copied here — secrets
# should not be duplicated into a second repo.
